<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Decide on the first-visit intro before first paint, so the grid
             never flashes in and then restarts. Once per session, and never
             with reduced motion. -->
        <script>
            try {
                if (!sessionStorage.getItem("intro-seen") &&
                    !matchMedia("(prefers-reduced-motion: reduce)").matches) {
                    document.documentElement.dataset.intro = "play";
                    sessionStorage.setItem("intro-seen", "1");
                }
            } catch (e) {}
        </script>

        <title>Ofuje — Software engineer, ML &amp; frontend</title>
        <meta name="description" content="Ofuje is a software engineer working across full-stack machine learning and frontend engineering. Projects, writing, and notes from building things.">

        <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

        <meta property="og:type" content="website">
        <meta property="og:title" content="Ofuje — Software engineer, ML &amp; frontend">
        <meta property="og:description" content="Projects, writing, and notes from building things across machine learning and the web.">
